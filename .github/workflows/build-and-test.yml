name: Build & Test Services

on:
  workflow_call:
    inputs:
      changed-services:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    if: ${{ inputs.changed-services != '[]' && inputs.changed-services != '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.changed-services) }}

    env:
      ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }} 
      ECR_REPOSITORY: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure AWS credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_TO_ASSUME }} 
          aws-region: ${{ secrets.AWS_REGION }} 

      - name: Build & Test
        working-directory: app/${{ matrix.service }}
        run: |
          mvn -B clean install

      - name: Build Docker image
        id: build_image
        working-directory: app/${{ matrix.service }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_NAME .
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
      
      # - name: Scan Docker image with Trivy
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: '${{ steps.build_image.outputs.image_name }}'
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

      - name: Push Docker image to ECR
        # if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' || github.ref_name == 'main' }}
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker push ${{ steps.build_image.outputs.image_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: app/${{ matrix.service }}/


