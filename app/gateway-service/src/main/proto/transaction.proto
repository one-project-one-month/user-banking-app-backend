syntax = "proto3";

package com.personalbanking.personaltransaction;

option java_package = "com.personalbanking.personaltransaction.proto.transaction";
option java_outer_classname = "TransactionProto";
option java_multiple_files = true;
service TransactionService {
  rpc PrepareTransaction(PrepareTransactionRequest) returns (PrepareTransactionResponse);
}

message PrepareTransactionRequest {
  int64 fromAccountId = 1;
  int64 toAccountId = 2;
}

message PrepareTransactionResponse {
  bool success = 1;
  string message = 2;
  string transaction_id = 3;
  string status = 4;
}