version: '3.8'

services:
  postgresSQL:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql      
    networks:
      - banknet

  nickname-service:
    build: ../nickname-service
    environment:
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      POSTGRES_HOST: postgresSQL
      POSTGRES_PORT: 5432
      POSTGRES_DB: bankdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    depends_on:
      postgresSQL:
        condition: service_started
    networks:
      - banknet
    ports:
      - "3001:3001"
      - "9098:9098"

networks:
  banknet:
    external: true

volumes:
  pgdata:

